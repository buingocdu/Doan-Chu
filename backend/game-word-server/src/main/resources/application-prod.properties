spring.application.name=game-word-server
# Render/nen tang PaaS truyen cong qua bien PORT; docker compose dung 8080
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/game_word_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public

# Khoa phai khop GameConfig (prefix game): max-attempts, score-min, score-max. Chinh qua bien moi truong GAME_MAX_ATTEMPTS...
game.max-attempts=6
game.score-min=10
game.score-max=100

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Gui email (quen mat khau). Dat qua bien moi truong SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, MAIL_FROM. Khong co SPRING_MAIL_HOST thi chuc nang quen mat khau bao loi.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${spring.mail.username:}}

# Dia chi web frontend, dung tao link dat lai mat khau trong email (vd https://<app>.vercel.app)
app.frontend-url=${FRONTEND_URL:http://localhost}

# Phong choi nhieu nguoi (DOC-007)
room.max-members=8
room.min-players=2
room.guess-time-seconds=300
room.guess-minute-options=5,10
room.hint-interval-seconds=30
room.turn-max-attempts=20
room.turn-seconds=30
room.chain-turn-seconds=30

# Ghep hinh: gioi han luoi, anh upload, thoi gian toi thieu moi manh (chong ket qua gia)
puzzle.min-grid=2
puzzle.max-grid=12
puzzle.max-upload-bytes=8388608
puzzle.max-image-side=1600
puzzle.min-image-side=300
puzzle.min-ms-per-piece=300
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Tai khoan quan tri (phan cach bang dau phay), tu dong thanh ADMIN. Dat qua ADMIN_USERNAMES
app.admin-usernames=${ADMIN_USERNAMES:}
