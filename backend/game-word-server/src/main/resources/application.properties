spring.application.name=game-word-server
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/game_word_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public

game.guess.max-attempts=10
game.score.min=10
game.score.max=100

jwt.secret=gameWordSecretKey2026!@#SecureKeyForJWT
jwt.expiration=86400000

spring.mvc.cors.allowed-origins=http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Gui email (quen mat khau). Dat qua bien moi truong SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, MAIL_FROM. Khong co SPRING_MAIL_HOST thi chuc nang quen mat khau bao loi.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${spring.mail.username:}}

# Dia chi web frontend, dung tao link dat lai mat khau trong email
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Phong choi nhieu nguoi (DOC-007)
room.max-members=8
room.min-players=2
room.guess-time-seconds=300
room.chain-turn-seconds=20
