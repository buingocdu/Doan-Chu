# File nay nam trong conf.d (ben trong khoi http). Xem docs/security/security-plan.md (DOC-008).

# Gioi han tan suat theo IP that cua client (lay tu X-Forwarded-For cua Caddy, xem set_real_ip_from ben duoi).
# Muc nhe de nhieu nguoi chung mot mang (lop hoc, wifi cong cong) van choi duoc.
#  auth : dang nhap / dang ky / quen + dat lai mat khau -> chong do mat khau, tao tai khoan rac, spam email
#  start: tao van choi (khong can dang nhap, moi lan ghi DB)
#  api  : moi request /api con lai (polling phong 1 lan/giay/nguoi)
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=start:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# Khong lo phien ban Nginx trong header "Server" va trang loi
server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    # Request den tu Caddy (mang Docker noi bo) -> tin X-Forwarded-For de lay IP that cho limit_req
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Header bao mat cho moi response. Khong dat add_header trong location (se lam mat cac dong nay).
    # CSP: chi chay script/ket noi tu chinh ten mien -> giam thiet hai neu co XSS (JWT nam trong localStorage)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    location = /api/game/start {
        limit_req zone=start burst=20 nodelay;
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    # API -> backend container
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
